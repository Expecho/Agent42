<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shared conversation — Agent 42</title>
  <!-- A shared conversation may contain anything the owner discussed; keep it out of search indexes. -->
  <meta name="robots" content="noindex, nofollow" />
  <!-- Don't leak the token (URL fragment) via the Referer header when following links in the content. -->
  <meta name="referrer" content="no-referrer" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet" />
  <!-- Code highlight themes (ADR 0083): richtext.js enables the one matching data-theme. Before viewer.css so
       its own .prose pre code colors win the specificity ties. -->
  <link rel="stylesheet" href="lib/highlight/github.min.css" data-hljs-theme="light" />
  <link rel="stylesheet" href="lib/highlight/github-dark.min.css" data-hljs-theme="dark" />
  <link rel="stylesheet" href="themes.css" />
  <link rel="stylesheet" href="viewer.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90' font-family='monospace' fill='%23FFB13D'>42</text></svg>" />
  <meta name="theme-color" content="#100f0d" />
  <script>
    // No-FOUC theme resolve. Public share pages default to LIGHT regardless of the OS preference; a recipient's
    // explicit toggle (below) is remembered in localStorage. A recipient has no server profile.
    (function () {
      var dark = false;
      try { dark = localStorage.getItem("agent42.share.theme") === "dark"; } catch (e) { /* default light */ }
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.content = dark ? "#100f0d" : "#f4efe4";
    })();
  </script>
</head>
<body>
  <div class="viewer">
    <header class="viewer__topbar">
      <span class="viewer__brand"><span class="viewer__mark">42</span>AGENT&nbsp;42</span>
      <span class="viewer__badge">read-only</span>
      <button type="button" class="viewer__theme" id="themeToggle" aria-label="Switch to dark theme" title="Toggle dark theme">&#9790;</button>
    </header>

    <main class="viewer__scroll">
      <div class="viewer__head" id="viewerHead" hidden>
        <h1 class="viewer__title" id="viewerTitle"></h1>
        <p class="viewer__agent" id="viewerAgent" hidden></p>
      </div>

      <div class="viewer__thread" id="thread"></div>

      <div class="viewer__state" id="viewerState">Loading…</div>
    </main>
  </div>

  <!-- Self-contained on purpose: the public viewer loads NOTHING from the authenticated app surface, so the
       Easy Auth hole stays confined to /shared/* + /api/share/* (marked/purify are copied under /shared/lib
       — keep them in sync with /lib on upgrade). Point any subresource here back at the authenticated app's
       own lib folder or stylesheet and recipients get a 401 instead of the page. Two tests hold this from
       opposite ends: ShareLinkAssetsTests checks this page asks for nothing off-limits, and (since ADR 0042)
       EasyAuthExclusionTests parses the src/href attributes below plus viewer.js's API templates and runs
       each through the measured excludedPaths matcher, so what it does ask for is provably carved out. -->
  <script src="lib/marked.min.js"></script>
  <script src="lib/purify.min.js"></script>
  <!-- The rich renderer (ADR 0083) is the SAME file the chat app loads; it already lives here under /shared/lib.
       Relative paths only (see the self-containment note below). -->
  <script src="lib/highlight/highlight.min.js"></script>
  <script src="lib/richtext.js"></script>
  <!-- Artifact cards + pane, the same file the chat app loads. Artifacts run in a sandboxed iframe. -->
  <script src="lib/artifactpane.js"></script>
  <script src="viewer.js"></script>
  <script>
    // Light/dark toggle (default light). richtext.js and artifactpane.js observe data-theme, so they follow.
    (function () {
      var btn = document.getElementById("themeToggle");
      function sync() {
        var dark = document.documentElement.dataset.theme === "dark";
        btn.textContent = dark ? "☀" : "☾";
        btn.setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
      }
      btn.addEventListener("click", function () {
        var dark = document.documentElement.dataset.theme !== "dark";
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.content = dark ? "#100f0d" : "#f4efe4";
        try { localStorage.setItem("agent42.share.theme", dark ? "dark" : "light"); } catch (e) { /* best-effort */ }
        sync();
      });
      sync();
    })();
  </script>
</body>
</html>
