# Publishes the Agent42 local bridge helper (tools/Agent42.LocalBridge, ADR 0076) as a GitHub Release:
# one self-contained, single-file executable per platform, so a user downloads it and runs it with no
# .NET installed. The helper is never deployed with the app — deploy.yml builds the backend image only and
# triggers on pushes to main, never on these tags.
#
# Three ways a release starts:
#   1. Automatically, when a push to main changes the helper (the `paths` below): the next PATCH version
#      after the highest stable local-bridge-v* tag (1.0.0 if there is none) is tagged and released.
#   2. Pushing a tag, to choose the version yourself (a new major/minor, or a pre-release):
#        git tag local-bridge-v2.0.0 && git push origin local-bridge-v2.0.0
#      Later automatic releases continue from it (2.0.1, …).
#   3. Running it manually with a version (it creates the tag on the chosen commit).
# The tag an automatic or manual run creates does NOT start a second run: events caused by the workflow's own
# GITHUB_TOKEN never trigger workflows. Runs are serialized (one concurrency group), so quick successive pushes
# never race for the same version; GitHub keeps only the NEWEST pending run, so of three rapid pushes the middle
# one may be skipped — the release then simply contains the latest code.
#
# Directory.Packages.props is in `paths` because it pins the helper's MCP SDK; a bump of any other package
# also cuts a (harmless, identical-behaviour) patch release — accepted, so a dependency fix is never missed.
#
# The repository has IMMUTABLE RELEASES on: once a release is published, its assets are locked (an upload is
# rejected with HTTP 422) and its tag can never be reused. So the release is created as a DRAFT, every asset and
# SHA256SUMS.txt are uploaded to the draft, and the last step publishes it. A draft has no tag yet (GitHub creates
# it on publish, on the draft's target commit), so the build jobs check out the commit SHA, not the tag. A failed
# run leaves only a draft — never a published release without binaries — and the next run for that version
# reuses the draft. A version that is already published cannot be released again: pick the next one.
#
# The self-contained/single-file settings live in the csproj (applied whenever a runtime identifier is
# given), so `dotnet publish -r <rid> -c Release` on a laptop builds the same asset.
#
# macOS assets are built ON macOS: the SDK ad-hoc signs the apphost only on a macOS host, and Apple
# Silicon refuses to run an unsigned binary. Nothing is code-signed or notarized beyond that, so Windows
# SmartScreen and macOS Gatekeeper will warn on first run — the release notes say how to proceed.
name: Release local bridge

on:
  push:
    branches: [main]
    paths:
      - tools/Agent42.LocalBridge/**
      - Directory.Packages.props
    tags: ['local-bridge-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the prefix (e.g. 1.0.0) — creates tag local-bridge-v<version>'
        required: true

permissions:
  contents: write

# One queue for every trigger: an automatic run must see the tag the previous run created before it picks
# the next version. Never cancel — a half-published release is worse than a late one.
concurrency:
  group: release-local-bridge
  cancel-in-progress: false

env:
  PROJECT: tools/Agent42.LocalBridge/Agent42.LocalBridge.csproj

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      sha: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          elif [ -n "$INPUT_VERSION" ]; then
            tag="local-bridge-v${INPUT_VERSION#v}"
          else
            # A push to main that changed the helper: next patch after the highest STABLE release tag.
            # Read from the remote, not the checkout (a shallow clone has no tags). Pre-release tags are
            # ignored, so 1.2.0-beta.1 never becomes the base of an automatic 1.2.1.
            latest="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/local-bridge-v" --paginate \
                        --jq '.[].ref | sub("^refs/tags/local-bridge-v"; "")' \
                      | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
            if [ -z "$latest" ]; then
              next="1.0.0"
            else
              IFS=. read -r major minor patch <<< "$latest"
              next="$major.$minor.$((patch + 1))"
            fi
            echo "Latest stable release: ${latest:-none}; releasing $next."
            tag="local-bridge-v$next"
          fi
          version="${tag#local-bridge-v}"
          # SemVer only: the version is stamped into the binary and shown by --version.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$version' is not a SemVer version (from tag '$tag')."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create the draft release (or reuse the draft a failed run left)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2> /dev/null)"; then
            if [ "$draft" != "true" ]; then
              echo "::error::Release $TAG is already published. Published releases are immutable; release a new version."
              exit 1
            fi
            echo "Draft release $TAG already exists; retargeting it to $GITHUB_SHA, assets will be replaced."
            gh release edit "$TAG" --target "$GITHUB_SHA"
            exit 0
          fi
          prerelease=""
          if [[ "$VERSION" == *-* ]]; then prerelease="--prerelease"; fi
          cat > notes.md <<'NOTES'
          The Agent42 local bridge lets your Agent42 chats use an MCP server that runs only on your computer
          (for example BrowserOS neo). See ADR 0076 and docs/features/remote-mcp-servers.md.

          **Download** the archive for your platform, extract it, and run:

          ```
          # Windows (PowerShell)
          $env:AGENT42_BRIDGE_KEY = "<the key Agent42 showed you>"
          .\Agent42.LocalBridge.exe --server https://chat.agent42.nl

          # macOS / Linux
          export AGENT42_BRIDGE_KEY="<the key Agent42 showed you>"
          ./Agent42.LocalBridge --server https://chat.agent42.nl
          ```

          No .NET installation is needed. The executables are **not code-signed**: on Windows choose
          *More info → Run anyway* in SmartScreen; on macOS run `xattr -d com.apple.quarantine Agent42.LocalBridge`
          once after extracting. Verify a download against `SHA256SUMS.txt`.
          NOTES
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "Agent42 local bridge $VERSION" \
            --notes-file notes.md $prerelease

  publish:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,     os: ubuntu-latest, archive: zip }
          - { rid: win-arm64,   os: ubuntu-latest, archive: zip }
          - { rid: linux-x64,   os: ubuntu-latest, archive: tar.gz }
          - { rid: linux-arm64, os: ubuntu-latest, archive: tar.gz }
          - { rid: osx-x64,     os: macos-latest,  archive: tar.gz }
          - { rid: osx-arm64,   os: macos-latest,  archive: tar.gz }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit, not the tag: a draft release's tag does not exist until it is published.
          ref: ${{ needs.create-release.outputs.sha }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Publish ${{ matrix.rid }}
        env:
          RID: ${{ matrix.rid }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: dotnet publish "$PROJECT" -c Release -r "$RID" -p:Version="$VERSION" -o "out/$RID"

      - name: Package
        id: package
        shell: bash
        env:
          RID: ${{ matrix.rid }}
          ARCHIVE: ${{ matrix.archive }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          name="agent42-local-bridge-$VERSION-$RID.$ARCHIVE"
          cd "out/$RID"
          # The single-file executable is the whole product; nothing else in the folder is needed.
          if [ "$ARCHIVE" = "zip" ]; then
            zip -j "$GITHUB_WORKSPACE/$name" Agent42.LocalBridge.exe
          else
            chmod +x Agent42.LocalBridge
            tar -czf "$GITHUB_WORKSPACE/$name" Agent42.LocalBridge
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Smoke test (native runners only)
        if: matrix.rid == 'linux-x64' || (runner.os == 'macOS' && matrix.rid == 'osx-arm64')
        shell: bash
        env:
          RID: ${{ matrix.rid }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          actual="$("out/$RID/Agent42.LocalBridge" --version)"
          echo "--version printed: $actual"
          [ "$actual" = "$VERSION" ]

      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.create-release.outputs.tag }}
          NAME: ${{ steps.package.outputs.name }}
        run: gh release upload "$TAG" "$NAME" --clobber

  # Runs only when every platform uploaded (a failed build leaves the draft unpublished), then publishes the
  # release: after this step its assets are immutable.
  finalize:
    needs: [create-release, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Attach SHA256SUMS.txt
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          mkdir assets && cd assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'agent42-local-bridge-*'
          sha256sum agent42-local-bridge-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber

      - name: Publish the release (creates the tag)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
