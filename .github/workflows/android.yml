# Builds and tests the Agent42 Android companion app (tools/Agent42.Android, the Android-companion ADR), and publishes
# it as a signed APK on a GitHub Release to sideload. It is never deployed with the app (deploy.yml does not trigger on
# tools/**) and is not on the Play Store.
#
# check: every PR and push that touches the app: unit tests, Android lint, a debug build. Path-filtered, so it is not a
#        required check; a PR that touches the app shows it red or green. It is deliberately NOT in pr-checks.yml, which
#        has no path filter: every .NET PR would pay the Gradle cost.
#
# release: started the same three ways as release-chrome-extension.yml:
#   1. Automatically, when a push to main changes the app: the next PATCH after the highest stable android-v* tag
#      (1.0.0 if there is none).
#   2. Pushing a tag to choose the version: git tag android-v2.0.0 && git push origin android-v2.0.0
#   3. Running it manually with a version.
#
# Android refuses to install an update whose versionCode does not increase, so versionCode is derived from the SemVer
# core as major*10000 + minor*100 + patch (minor and patch must stay below 100). The repository has IMMUTABLE RELEASES
# on, so the release is created as a DRAFT, the APK and SHA256SUMS.txt are uploaded, and only then is it published.
name: Android app

on:
  pull_request:
    branches: [main]
    paths:
      - tools/Agent42.Android/**
      - .github/workflows/android.yml
  push:
    branches: [main]
    paths:
      - tools/Agent42.Android/**
      - .github/workflows/android.yml
    tags: ['android-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the prefix (e.g. 1.0.0) — creates tag android-v<version>'
        required: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/Agent42.Android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Unit tests, lint, debug build
        run: ./gradlew --no-daemon test lint assembleDebug

  release:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-android
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          elif [ -n "$INPUT_VERSION" ]; then
            tag="android-v${INPUT_VERSION#v}"
          else
            latest="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/android-v" --paginate \
                        --jq '.[].ref | sub("^refs/tags/android-v"; "")' \
                      | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
            if [ -z "$latest" ]; then
              next="1.0.0"
            else
              IFS=. read -r major minor patch <<< "$latest"
              next="$major.$minor.$((patch + 1))"
            fi
            echo "Latest stable release: ${latest:-none}; releasing $next."
            tag="android-v$next"
          fi
          version="${tag#android-v}"
          if ! [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$version' is not a SemVer version (from tag '$tag')."
            exit 1
          fi
          major="${BASH_REMATCH[1]}"; minor="${BASH_REMATCH[2]}"; patch="${BASH_REMATCH[3]}"
          if [ "$minor" -ge 100 ] || [ "$patch" -ge 100 ]; then
            echo "::error::minor and patch must stay below 100: versionCode is major*10000 + minor*100 + patch."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_OUTPUT"

      - name: Decode the signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set: a release APK can't be signed. See CLAUDE.md, manual prerequisites."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Create the draft release (or reuse the draft a failed run left)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2> /dev/null)"; then
            if [ "$draft" != "true" ]; then
              echo "::error::Release $TAG is already published. Published releases are immutable; release a new version."
              exit 1
            fi
            gh release edit "$TAG" --target "$GITHUB_SHA"
            exit 0
          fi
          prerelease=""
          if [[ "$VERSION" == *-* ]]; then prerelease="--prerelease"; fi
          cat > notes.md <<'NOTES'
          The Agent42 Android companion app: chat, and a hands-free voice mode.

          **Install**

          1. On the phone, download `agent42-android-<version>.apk` from this release.
          2. Open it and allow installing from this source when Android asks.
          3. Open Agent 42 and sign in.

          To update, install the newer APK over the old one; it keeps its data. Verify a download against
          `SHA256SUMS.txt`.
          NOTES
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "Agent42 Android $VERSION" \
            --notes-file notes.md $prerelease

      - name: Build the signed release APK (version stamped)
        id: package
        working-directory: tools/Agent42.Android
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          CODE: ${{ steps.meta.outputs.code }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease -Pagent42.versionName="$VERSION" -Pagent42.versionCode="$CODE"
          name="agent42-android-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload, attach SHA256SUMS.txt, then publish (creates the tag)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          NAME: ${{ steps.package.outputs.name }}
        run: |
          gh release upload "$TAG" "$NAME" --clobber
          sha256sum "$NAME" > SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber
          gh release edit "$TAG" --draft=false
