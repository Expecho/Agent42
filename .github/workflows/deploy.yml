name: Deploy

on:
  push:
    branches: [main]
    paths:
      - src/**
      - infra/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

env:
  REGISTRY_NAME: crexpechohosting
  IMAGE_NAME: agent42-backend
  SEARXNG_IMAGE_NAME: agent42-searxng
  RESOURCE_GROUP: rg-agent42

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v7

      - id: tag
        run: echo "value=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      # sp-agent42-deploy authenticates with a client secret (not OIDC), so the
      # login action needs the full credentials JSON rather than client-id alone.
      - name: Log in to Azure
        uses: azure/login@v3
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Log in to container registry
        run: az acr login --name "$REGISTRY_NAME"

      - name: Build image
        run: |
          docker build \
            -f src/Agent42.Backend/Dockerfile \
            -t "$REGISTRY_NAME.azurecr.io/$IMAGE_NAME:${{ steps.tag.outputs.value }}" \
            -t "$REGISTRY_NAME.azurecr.io/$IMAGE_NAME:latest" \
            .

      - name: Push image
        run: docker push --all-tags "$REGISTRY_NAME.azurecr.io/$IMAGE_NAME"

      # The SearXNG sidecar backing the web_search tool (ADR 0011): a thin image over a pinned
      # upstream tag with our settings.yml baked in (mounting it would need an Azure Files volume,
      # and the SEARXNG_* env overrides don't reach the `search:` section where search.formats lives).
      - name: Build SearXNG sidecar image
        run: |
          docker build \
            -t "$REGISTRY_NAME.azurecr.io/$SEARXNG_IMAGE_NAME:${{ steps.tag.outputs.value }}" \
            -t "$REGISTRY_NAME.azurecr.io/$SEARXNG_IMAGE_NAME:latest" \
            infra/searxng

      - name: Push SearXNG sidecar image
        run: docker push --all-tags "$REGISTRY_NAME.azurecr.io/$SEARXNG_IMAGE_NAME"

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v7

      - name: Log in to Azure
        uses: azure/login@v3
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Deploy Bicep
        id: deploy
        run: |
          acr_password=$(az acr credential show --name "$REGISTRY_NAME" --query "passwords[0].value" -o tsv)

          # cosmosLocation is pinned to North Europe: West Europe was rejecting new
          # Cosmos accounts on first deploy ("high demand ... cannot fulfill your
          # request at this time"), and the account's region can't change after
          # creation, so this must keep matching wherever it actually lives.
          principal_id=$(az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters \
              imageTag="${{ needs.build-and-push.outputs.image-tag }}" \
              searxngImageTag="${{ needs.build-and-push.outputs.image-tag }}" \
              acrAdminUsername="$REGISTRY_NAME" \
              acrAdminPassword="$acr_password" \
              authClientSecret="${{ secrets.AAD_CLIENT_SECRET }}" \
              searxngSecret="${{ secrets.SEARXNG_SECRET }}" \
              azureOpenAIApiKey="${{ secrets.AZURE_OPENAI_API_KEY }}" \
              googleMapsApiKey="${{ secrets.GOOGLE_MAPS_API_KEY }}" \
              githubModelsToken="${{ secrets.GH_MODELS_TOKEN }}" \
              cosmosLocation="northeurope" \
              otlpEndpoint="http://home.peterbons.nl:4317" \
            --query properties.outputs.containerAppPrincipalId.value -o tsv)
          echo "principal-id=$principal_id" >> "$GITHUB_OUTPUT"

      # Not managed via the Bicep above: the AI Foundry account lives in a separate
      # resource group ('agent42') that this deploy identity has no general access
      # to (only a role-assignment-scoped grant on this one account — see
      # infra/main.bicep's history for why). A nested Bicep module targeting that
      # RG would need Microsoft.Resources/deployments/write there too, which wasn't
      # granted; a direct role-assignment PUT only needs
      # Microsoft.Authorization/roleAssignments/write on the account itself, which
      # was granted. Idempotent: skips if the container app identity already holds
      # the role (e.g. unchanged between deploys).
      - name: Grant Cognitive Services OpenAI User role to the container app identity
        run: |
          principal_id="${{ steps.deploy.outputs.principal-id }}"
          scope="/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/resourceGroups/agent42/providers/Microsoft.CognitiveServices/accounts/Agent42"
          role_definition_id="/subscriptions/${{ secrets.AZURE_SUBSCRIPTION_ID }}/providers/Microsoft.Authorization/roleDefinitions/5e0bd9bd-7b93-4f28-af87-19fc36ad61bd"

          existing_count=$(az rest --method get \
            --url "https://management.azure.com${scope}/providers/Microsoft.Authorization/roleAssignments?api-version=2022-04-01&\$filter=principalId eq '${principal_id}'" \
            --query "length(value[?properties.roleDefinitionId=='${role_definition_id}'])" -o tsv)

          if [ "$existing_count" = "0" ]; then
            az rest --method put \
              --url "https://management.azure.com${scope}/providers/Microsoft.Authorization/roleAssignments/$(uuidgen)?api-version=2022-04-01" \
              --body "{\"properties\":{\"roleDefinitionId\":\"${role_definition_id}\",\"principalId\":\"${principal_id}\",\"principalType\":\"ServicePrincipal\"}}"
          fi
