# Single source of truth for branch policy and quality-gate thresholds.
# Hooks, skills, and CI read this file; values are NEVER hardcoded elsewhere.

branches:
  protected: [main]  # read by .claude/hooks/protect-main.mjs and lefthook.yml

# EVERY GATE BELOW MUST HAVE A MEASURING TOOL IN THIS REPO (ADR 0050).
# That is the admission test, and it is the whole point: a threshold nothing measures cannot fail, so
# it is not a gate — it is a wish that reads like one. Three such entries were removed rather than
# estimated (new_issues, new_security_issues, duplication_pct_max); the tool for each is named here.
gates:
  # node .agentic/scripts/check-new-code-coverage.mjs — coverlet cobertura x git diff, so this is the
  # coverage of the lines this branch ADDED, not the repo's slow-moving overall number.
  coverage_new_code_pct_min: 80
  # SonarAnalyzer.CSharp rule S3776, at build time (Directory.Packages.props + .editorconfig).
  # NOT cyclomatic complexity — a different metric with different numbers. The value here matches the
  # analyzer's built-in default exactly, so there is one source of truth; changing it requires a
  # SonarLint.xml AdditionalFile, and QualityGateTests fails if the two ever disagree.
  cognitive_complexity_max: 15
  # SonarAnalyzer.CSharp rule S138, at build time (.editorconfig, severity error). Lines of CODE (non-blank,
  # non-comment). 80 is the analyzer's built-in default, so there is one number; QualityGateTests pins it.
  method_lines_max: 80
  # SonarAnalyzer.CSharp rule S107, at build time. 11 is NOT the analyzer's default (7): it is where the code was
  # when the gate was set (25 offenders over 7), carried by SonarLint.xml, and ratchets down. One reasoned
  # exemption (the AgentGrain ctor, 18) is a path-scoped section in .editorconfig.
  method_params_max: 11
  # tests/e2e/playwright.config.mjs (ADR 0151): the three e2e smoke layers. The measurement is Playwright's exit status in
  # the CI job (e2e-devhost, e2e-selfhost.yml) and the `smoke` job's script, the same shape as vulnerable_packages: 0 —
  # a job result, not a computed number. The key is numeric only because QualityGateTests requires it.
  e2e_failing_tests_max: 0

enforcement:
  local: soft_warning        # skills render the gate table, ask proceed/abort on FAIL
  ci: hard_block             # PR checks (.github/workflows/pr-checks.yml) block on:
                             # build, tests, dotnet format, vulnerable packages,
                             # doc-path integrity, bicep build, new-code coverage and the e2e smoke
                             # layers (e2e-devhost in pr-checks.yml, e2e-selfhost.yml; post-deploy `smoke` in deploy.yml).
                             # cognitive_complexity_max BLOCKS: S3776 is an `error`, so a method over
                             # the threshold fails `dotnet build` (ADR 0051 cleared the backlog that
                             # ADR 0050 had to carry).

dependencies:
  vulnerable_packages: 0     # hard block (CI: vulnerable-packages job, .github/workflows/pr-checks.yml)
  outdated_packages: report  # soft — surfaced in CI, upgraded via MRs, not blocked
  add_policy: latest-stable  # new deps resolved from the feed at add time, never from memory

coverage_tooling: coverlet  # dotnet test Agent42.slnx --collect:"XPlat Code Coverage"
